version: '3.8'

services:
  db:
    image: mysql:8.0
    container_name: inventorypro-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root_password_123
      MYSQL_DATABASE: retail_db
      MYSQL_USER: app_user
      MYSQL_PASSWORD: app_password_123
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: inventorypro-app
    restart: always
    depends_on:
      db:
        condition: service_healthy
    environment:
      PORT: 5000
      NODE_ENV: production
      JWT_SECRET: your_jwt_secret_key_change_in_production
      DB_HOST: db
      DB_PORT: 3306
      DB_USER: app_user
      DB_PASSWORD: app_password_123
      DB_NAME: retail_db
      DB_SSL: "false"
      CORS_ORIGIN: "*"
    ports:
      - "5000:5000"

volumes:
  mysql_data:

