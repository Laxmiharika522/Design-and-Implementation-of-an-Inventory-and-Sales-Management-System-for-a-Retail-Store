version: 1.0
runtime: nodejs20
build:
  commands:
    build:
      - npm install --prefix server
      - npm install --prefix client
      - npm run build --prefix client
run:
  command: node server/src/index.js
  network:
    port: 5000
    env: APP_PORT
  env:
    - name: NODE_ENV
      value: production
    - name: PORT
      value: "5000"

